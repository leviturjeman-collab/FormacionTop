name: Verify academy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/automation-test-requirements.txt
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install browser and operating-system dependencies
        run: npx playwright-core install --with-deps chromium
      - name: Prepare isolated Python test environment
        run: node scripts/test-executable-assets.mjs --setup
      - name: Verify content, code, security, student journeys and executable assets
        run: npm test
